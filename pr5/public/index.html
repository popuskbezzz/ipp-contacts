<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телефонный справочник</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 940px; padding: 36px 24px; font: 16px/1.5 "Inter", system-ui, sans-serif; background: #eef2f7; color: #14283b; }
  h1 { margin: 0 0 24px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.035em; }
  h2 { margin: 0 0 12px; font-size: 1.23rem; }
  form, section { padding: 24px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; }
  fieldset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; border: 0; margin: 0; padding: 0; }
  label { display: grid; gap: 5px; }
  input { padding: 9px; border: 1px solid #8497ab; border-radius: 6px; width: 100%; font: inherit; }
  button { border: 1px solid #174b73; border-radius: 6px; padding: 8px 12px; font: inherit; background: #174b73; color: white; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button.secondary { color: #174b73; background: #fff; }
  button.danger { color: #912c31; border-color: #912c31; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  article { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 0; border-top: 1px solid #dce4ed; overflow-wrap: anywhere; }
  .status { margin: 8px 0; min-height: 24px; color: #146149; }
  [role=alert] { color: #912c31; }
  @media (max-width: 670px) { fieldset { grid-template-columns: 1fr; } }
</style>
</head>
<body><contacts-app></contacts-app><script defer src="app.js"></script></body>
</html>
